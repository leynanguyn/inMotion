  // and capped to a modest size. Tagged with the color it was made in.
  // Called from placeTrace with the drawn path and the deliberately
  // chosen drop position (restPosOverride) — or, without an override,
  // it falls back to picking a random uncrowded rest spot as it always
  // did (the inactivity fallback passes the mark's own current center).
  function commitTrace(rawPathSamples, chargeStrength, now, restPosOverride) {
    const hasPath = rawPathSamples && rawPathSamples.length > 0;
    const rawTimed = hasPath ? rawPathSamples : [{ pos: sphereGroup.position.clone(), t: 0 }];
    const rawWorldPositions = rawTimed.map((p) => p.pos);

    const resampled = resamplePathWithTiming(rawTimed, TRACE_RESAMPLE_COUNT);

    let cx = 0, cy = 0, cz = 0;
    for (const p of resampled) { cx += p.pos.x; cy += p.pos.y; cz += p.pos.z; }
    cx /= resampled.length; cy /= resampled.length; cz /= resampled.length;
    const centroid = new THREE.Vector3(cx, cy, cz);

    // Store the path at its TRUE drawn scale (no shrink). A placed trace
    // must stay the same size and shape it was dragged to and dropped at —
    // so it reads as "my trace, left right here", not a tiny dormant speck.
    // Older traces still settle into a tight cluster at rest (see
    // updateTraceVisuals) because their rest position-blend keeps them
    // clustered until hovered; only their resolved/revealed form uses this
    // full scale.
    const restPos = restPosOverride || randomTraceRestSpot();

    const trace = {
      id: 'tr_' + Date.now() + '_' + Math.floor(Math.random() * 100000),
      path: resampled.map((p) => ({
        x: (p.pos.x - centroid.x),
        y: (p.pos.y - centroid.y),
        z: (p.pos.z - centroid.z),
        t: p.t
      })),
      duration: resampled[resampled.length - 1].t,
      hue: currentHue,
      strength: chargeStrength,
      restPos: { x: restPos.x, y: restPos.y, z: restPos.z },
      completedAt: Date.now(),
      respondsTo: findResponseTarget(rawWorldPositions, now)
    };

    traces.push(trace);
    newestTraceId = trace.id; // this one now pulses; the prior newest demotes to dim/static
    pruneTracesIfOverMax();
    saveTraces();
    pushSharedTrace(trace);
    sendLightSignal('L'); // trace just left as dormant, for the next person to find
    createTraceVisual(trace);
  }

  function createTraceVisual(trace) {
    const n = trace.path.length;
    const positions = new Float32Array(n * 3);
    const colors = new Float32Array(n * 3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const mat = new THREE.PointsMaterial({
      size: 1.3,
      map: particleTexture,
      transparent: true,
      depthTest: false, // finalized traces must remain visible over the reforming sphere
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexColors: true,
      sizeAttenuation: true,
      opacity: 0.95
    });
    const points = new THREE.Points(geo, mat);
    points.renderOrder = 20;
    const glow = addGlowLayer(points, scene, 3, 0.4);
    glow.material.depthTest = false;
    glow.renderOrder = 19;
    scene.add(points);

    const jitter = [];
    for (let i = 0; i < n; i++) {
      jitter.push(new THREE.Vector3((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6));
    }

    traceVisuals.set(trace.id, {
      points, glow, jitter,
      revealLevel: DORMANT_FLOOR,
      linkBoost: 0,
      holdSeconds: 0,        // continuous targeted-hold time this session, see updateTraceVisuals
      revealSignaled: false, // guards sendLightSignal('R') to once per hold, see updateTraceVisuals
      seedPhase: Math.random() * Math.PI * 2,
      replayClock: trace.duration > 0 ? Math.random() * trace.duration : 0 // stagger so traces don't all pulse in sync
    });
  }

  function disposeTraceVisual(trace) {
    const v = traceVisuals.get(trace.id);
    if (!v) return;
    scene.remove(v.points);
    v.points.geometry.dispose();
    v.points.material.dispose();
    scene.remove(v.glow);
    v.glow.material.dispose();
    traceVisuals.delete(trace.id);
  }

  function rebuildAllTraceVisuals() {
    for (const tr of traces) createTraceVisual(tr);
    // the most recently completed trace (across what was loaded) is newest
    if (traces.length) {
      let newest = traces[0];
      for (const tr of traces) if (tr.completedAt > newest.completedAt) newest = tr;
      newestTraceId = newest.id;
    }
  }

  function pruneTracesIfOverMax() {
    if (traces.length <= MAX_TRACES) return;
    traces.sort((a, b) => a.completedAt - b.completedAt);
    const removed = traces.shift();
    disposeTraceVisual(removed);
    for (const tr of traces) if (tr.respondsTo === removed.id) tr.respondsTo = null;
  }

  // Layers 2 & 3 — every finalized trace is always shown as itself: the
  // actual path someone else drew, not an abstract unresolved cluster of
  // dust. Dormant traces just sit dim and faint, the newest glows and
  // breathes so the next person can spot it immediately, and traces dim
  // progressively further back by recency as more of them accumulate, so
  // a full background never reads as crowded or noisy. A trace being
  // actively targeted eases up toward full brightness on top of all that,
  // with a moving pulse of light traveling along it at the original
  // gesture's own recorded tempo — literally replaying where the hand
  // was, in order, at the timing it was actually there.
  function updateTraceVisuals(t, dt, targetedIds) {
    const riseRate = 1 - Math.exp(-dt / REVEAL_RISE_SECONDS);
    const fallRate = 1 - Math.exp(-dt / REVEAL_FALL_SECONDS);

    // recency rank per trace (0 = newest), the more traces pile up the
    // further back the oldest ranks reach — this is what drives the
    // progressive dimming below, not just a flat newest/older split
    const rankById = new Map();
    traces.slice().sort((a, b) => b.completedAt - a.completedAt)
      .forEach((tr, i) => rankById.set(tr.id, i));

    for (const tr of traces) {
      const v = traceVisuals.get(tr.id);
      if (!v) continue;
      if (targetedIds.has(tr.id)) {
        v.revealLevel += (1 - v.revealLevel) * riseRate;
        recentlyRevealedAt.set(tr.id, performance.now());
        v.holdSeconds += dt;
        if (!v.revealSignaled && v.holdSeconds >= REVEAL_HOLD_SECONDS) {
          sendLightSignal('R'); // this trace has finished revealing
          v.revealSignaled = true;
        }
      } else {
        v.revealLevel += (DORMANT_FLOOR - v.revealLevel) * fallRate;
        // any break in the hold resets the timer and re-arms the signal —
        // the next continuous 2s hold (on this trace or a later one) fires again
        v.holdSeconds = 0;
        v.revealSignaled = false;
      }
    }

    // Layer 4 — response linking: a trace currently being revealed lends
    // some of its brightness to whatever it answers (or was answered by),
    // eased the same way so it never snaps on or off
    for (const tr of traces) {
      const v = traceVisuals.get(tr.id);
      if (!v) continue;
      let boostTarget = 0;
      for (const other of traces) {
        if (other.id === tr.id) continue;
        const linked = other.respondsTo === tr.id || tr.respondsTo === other.id;
        if (!linked || !targetedIds.has(other.id)) continue;
        const ov = traceVisuals.get(other.id);
        if (ov) boostTarget = Math.max(boostTarget, LINK_BOOST_FACTOR * ov.revealLevel);
      }
      const rate = boostTarget > v.linkBoost ? riseRate : fallRate;
      v.linkBoost += (boostTarget - v.linkBoost) * rate;
    }

    for (const tr of traces) {
      const v = traceVisuals.get(tr.id);
      if (!v) continue;

      // hover-driven brightness (reveal/response) — this is what resolves a
      // trace into its recorded shape and runs the traveling replay light
      const revealDisplay = clamp(Math.max(v.revealLevel, v.linkBoost), 0, 1);

      // persistence baseline — every finalized trace stays visible at a
      // resting brightness, dim and faint by default. The newest one sits
      // brightest and breathes (a gentle opacity + scale pulse) to read as
      // "newest / active"; every trace behind it dims further the further
      // back its recency rank is, sliding from TRACE_OLDER_BASE down to
      // TRACE_OLDEST_FLOOR over TRACE_DIM_RANK_SPAN traces — so the more
      // that accumulate, the dimmer the old ones settle, keeping a full
      // background calm instead of crowded. Hover brightness rises above
      // this baseline; it never drops below it.
      const isNewest = tr.id === newestTraceId;
      const pulseNorm = 0.5 + 0.5 * Math.sin(t * TRACE_NEWEST_PULSE_SPEED + v.seedPhase);
      const pulse = isNewest ? TRACE_NEWEST_PULSE_AMP * pulseNorm : 0;
      const rank = rankById.get(tr.id) || 0;
      const rankDimT = clamp(rank / TRACE_DIM_RANK_SPAN, 0, 1);
      const agedBase = lerp(TRACE_OLDER_BASE, TRACE_OLDEST_FLOOR, rankDimT);
      const persist = (isNewest ? TRACE_NEWEST_BASE : agedBase) + pulse;

      // brightness blends hover reveal with the persistence baseline
      const bright = clamp(Math.max(revealDisplay, persist), 0, 1);
      const shaped = Math.pow(bright, 1.6);

      // POSITION resolve is separate from brightness: every trace always
      // shows its actual recorded shape — the real gesture someone left,
      // not an abstract dust cluster — dim or bright doesn't change that.
      // A hand hovering can still fully resolve/crisp it further.
      const posDisplay = Math.max(revealDisplay, isNewest ? 0.92 : TRACE_SHAPE_FLOOR);
      const settle = 1 - posDisplay;

      // the traveling replay light only runs while a trace is actually
      // being revealed by a hand — dimmed background traces stay static
      const revealing = revealDisplay >= TRACE_REPLAY_REVEAL_MIN;
      if (tr.duration > 50 && revealing) {
        v.replayClock += dt * 1000;
        const loopLen = tr.duration + TRACE_REPLAY_PAUSE_MS;
        if (v.replayClock > loopLen) v.replayClock -= loopLen;
      }

      const posAttr = v.points.geometry.attributes.position;
      const colAttr = v.points.geometry.attributes.color;
      const color = new THREE.Color().setHSL(tr.hue / 360, 0.68, 0.6);
      const brightness = shaped * 1.7;
      const restX = tr.restPos.x, restY = tr.restPos.y, restZ = tr.restPos.z;

      for (let i = 0; i < tr.path.length; i++) {
        const p = tr.path[i], j = v.jitter[i];
        const driftX = Math.sin(t * 0.35 + v.seedPhase + i) * settle * 3;
        const driftY = Math.cos(t * 0.3 + v.seedPhase + i * 1.3) * settle * 3;
        const ox = lerp(j.x * 0.4, p.x, posDisplay);
        const oy = lerp(j.y * 0.4, p.y, posDisplay);
        const oz = lerp(j.z * 0.4, p.z, posDisplay);
        posAttr.setXYZ(i, restX + ox + driftX, restY + oy + driftY, restZ + oz);

        let travel = 0;
        if (tr.duration > 50 && revealing) {
          const tDist = Math.abs(p.t - v.replayClock);
          travel = clamp(1 - tDist / TRACE_PULSE_WINDOW_MS, 0, 1);
        }
        const b = brightness * (1 + travel * 1.8);
        colAttr.setXYZ(i, color.r * b, color.g * b, color.b * b);
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
      // the newest/placed trace is rendered as prominent dots (matching the
      // drawn-trail bead look), with a pronounced size breath — large and
      // obvious enough that whoever encounters it next can immediately
      // pick it out as "the one just left"; older traces are the small
      // dim clusters. Both are dots, never a connecting line.
      v.points.material.size = isNewest ? (8.5 + 3.5 * pulseNorm) : (1.7 + shaped * 2.4);
      v.glow.material.opacity = isNewest ? (0.35 + 0.4 * pulseNorm) : (0.1 + shaped * 0.45);
      // the glow was only ever sized once at creation time, so it quietly
      // fell out of step with the core dot's own pulse/reveal size — keep
      // it locked to a fixed multiple of the current core size every frame
      v.glow.material.size = v.points.material.size * 2.6;
    }
  }

  // Layer 3 — discovery. An open, held-still palm near a dormant trace's
  // resting point wakes it. This is mutually exclusive with charging (a
  // pinching hand is never "open"), so it never competes with the live
  // sphere's own pinch-charge mechanic — it's simply also true of the
  // same tracked hand on frames where it isn't pinching. Velocity is
  // tracked independently of the existing rotation state so this addition
  // can never influence that math.
  function isOpenEnoughToReveal(lm) {
    return countExtendedFingers(lm) >= REVEAL_MIN_FINGERS;
  }
  function findNearestDormantTrace(worldPos, radius) {
    let nearest = null, nearestD = Infinity;
    for (const tr of traces) {
      const rp = new THREE.Vector3(tr.restPos.x, tr.restPos.y, tr.restPos.z);
      const d = worldPos.distanceTo(rp);
      if (d < nearestD) { nearestD = d; nearest = tr; }
    }
    return nearest && nearestD <= radius ? nearest : null;
  }
  function updateReveal(state, lm, dt) {
    if (!lm) { state.revealLastWorldPos = null; return null; }
    const world = handWorldPos(lm);
    const velocity = state.revealLastWorldPos ? world.distanceTo(state.revealLastWorldPos) / Math.max(dt, 0.001) : 0;
    state.revealLastWorldPos = world.clone();

    if (state.wasPinching) return null;
    if (!isOpenEnoughToReveal(lm)) return null;
    if (velocity > REVEAL_STILL_VELOCITY_MAX) return null;

    return findNearestDormantTrace(world, REVEAL_RADIUS);
  }

  // Overrides the bottom hint (set moments earlier, this same frame, by
  // updateHintText inside updateHands) only when a reveal is actually in
  // progress — the four existing hint states and their own logic are
  // never touched.
  function updateRevealHint(anyRevealing) {
    if (anyRevealing) hintEl.textContent = `hold for ${REVEAL_HOLD_SECONDS} seconds to reveal your trace`;
  }

  // Layer 4 — a faint thread between a trace and whatever it answers,
  // visible only in proportion to how awake either end currently is.
  function updateLinkThreads() {
    const desired = new Set();
    for (const tr of traces) {
      if (!tr.respondsTo) continue;
      const other = traces.find((o) => o.id === tr.respondsTo);
      if (!other) continue;
      const key = [tr.id, other.id].sort().join('|');
      desired.add(key);
      if (!linkLines.has(key)) {
        const a = tr.restPos, b = other.restPos;
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(a.x, a.y, a.z),
          new THREE.Vector3(b.x, b.y, b.z)
        ]);
        const mat = new THREE.LineBasicMaterial({
          color: 0xd9b26a, transparent: true, opacity: 0,
          blending: THREE.AdditiveBlending, depthWrite: false
        });
        const line = new THREE.Line(geo, mat);
        scene.add(line);
        linkLines.set(key, { line, aId: tr.id, bId: other.id });
      }
    }
    for (const [key, entry] of linkLines) {
      if (!desired.has(key)) {
        scene.remove(entry.line);
        entry.line.geometry.dispose();
        entry.line.material.dispose();
        linkLines.delete(key);
        continue;
      }
      const va = traceVisuals.get(entry.aId), vb = traceVisuals.get(entry.bId);
      const la = va ? Math.max(va.revealLevel, va.linkBoost) : 0;
      const lb = vb ? Math.max(vb.revealLevel, vb.linkBoost) : 0;
      entry.line.material.opacity = clamp(Math.max(la, lb) * 0.5, 0, 0.5);
    }
  }

  // ===========================================================================
  // MediaPipe Hands setup
  // ===========================================================================
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4/${file}`
  });
  hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.65,
    minTrackingConfidence: 0.6
  });
  hands.onResults(onHandsResults);

  function onHandsResults(results) {
    const lmList = results.multiHandLandmarks || [];
    const handednessList = results.multiHandedness || [];

    let lmByKey = { Left: null, Right: null };
    for (let i = 0; i < lmList.length; i++) {
      const label = handednessList[i] && handednessList[i].label;
      if ((label === 'Left' || label === 'Right') && !lmByKey[label]) lmByKey[label] = lmList[i];
    }
    currentLeftLm = lmByKey.Left;
    currentRightLm = lmByKey.Right;
  }

  // ---------------------------------------------------------------------
  // Camera bootstrap
  // ---------------------------------------------------------------------
  let mpCamera = null;
  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      loadingEl.textContent = 'camera not available in this browser/context';
      return;
    }
    try {
      mpCamera = new Camera(videoEl, {
        onFrame: async () => {
          await hands.send({ image: videoEl });
        },
        width: 640,
        height: 480
      });
      mpCamera.start().then(() => {
        loadingEl.style.opacity = '0';
        setTimeout(() => { loadingEl.style.display = 'none'; }, 650);
      }).catch((err) => {
        loadingEl.textContent = 'camera access needed — please allow and reload';
        console.error(err);
      });
    } catch (err) {
      loadingEl.textContent = 'camera access needed — please allow and reload';
      console.error(err);
    }
  }
  startCamera();

  // ---------------------------------------------------------------------
  // Webcam background toggle
  // ---------------------------------------------------------------------
  let camVisible = false;
  toggleCamBtn.addEventListener('click', () => {
    camVisible = !camVisible;
    videoEl.classList.toggle('visible', camVisible);
    toggleCamBtn.classList.toggle('on', camVisible);
    toggleCamBtn.textContent = camVisible ? 'Webcam: On' : 'Webcam: Off';
  });

  // ---------------------------------------------------------------------
  // Web Serial — optional physical LED companion. Entirely additive: with
  // no Arduino connected (or in a browser without Web Serial at all) the
  // app behaves exactly as before. sendLightSignal() below is a no-op
  // whenever serialWriter isn't set, so every call site can fire-and-forget
  // without checking connection state itself.
  // ---------------------------------------------------------------------
  let serialWriter = null;
  if ('serial' in navigator) {
    connectLightBtn.style.display = 'block';
    connectLightBtn.addEventListener('click', async () => {
      try {
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 });
        serialWriter = port.writable.getWriter();
        connectLightBtn.classList.add('on');
        connectLightBtn.textContent = 'Light: Connected';
      } catch (err) {
        console.warn('inMotion: could not connect to light', err);
      }
    });
  }
  function sendLightSignal(command) {
    if (!serialWriter) return;
    serialWriter.write(new TextEncoder().encode(command)).catch((err) => {
      console.warn('inMotion: light signal failed', err);
    });
  }

  // ===========================================================================
  // Main loop
  // ===========================================================================
  let lastTime = performance.now();

  function animate() {
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const t = now / 1000;

    updateHands(now, dt);
    updateExplode(now, dt);
    updateDrawing(now, dt);
    updateScatteredActivity(now, dt);
    checkScatteredInactivity(now);
    updateSphereVisual(t);
    updateDrawTrailVisual(now);

    // Two fully separate modes, never sharing caption state:
    //   • leave-a-trace (the whole 'scattered' phase) — updateDrawHint is
    //     the sole caption authority; reveal detection does not run at all.
    //   • discover-a-trace (everywhere else, chiefly idle) — reveal may
    //     wake a nearby dormant trace and own the caption.
    // Because reveal detection is skipped entirely during 'scattered',
    // the reveal prompt physically cannot appear during drawing/finalize/
    // placement, and there's no shared flag for the two to fight over.
    const leavingTrace = explodePhase === 'scattered';
    const targetedIds = new Set();
    if (!leavingTrace) {
      const rTarget = updateReveal(handStates.Right, currentRightLm, dt);
      const lTarget = updateReveal(handStates.Left, currentLeftLm, dt);
      if (rTarget) targetedIds.add(rTarget.id);
      if (lTarget) targetedIds.add(lTarget.id);
    }
    updateTraceVisuals(t, dt, targetedIds);
    updateLinkThreads();
    if (updateDrawHint()) {
      // leave-a-trace owns the caption this frame; reveal stays silent
    } else {
      updateRevealHint(targetedIds.size > 0);
    }

    drawOverlay();

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  loadTraces();
  rebuildAllTraceVisuals();
  pullSharedTraces();
  setInterval(pullSharedTraces, SHARED_POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullSharedTraces(); });
  requestAnimationFrame(animate);

})();
</script>
</body>
</html>
